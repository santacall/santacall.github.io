<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <style>
    :root { --bg: #0d1530; --card: #141f42; --text: #eef0f7; --muted: #aab3cc; --gold: #f2c86b; --line: #26325c; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    header, main, footer { max-width: 760px; margin: 0 auto; padding: 0 20px; }
    header { padding-top: 32px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; }
    header .brand { color: var(--gold); font-weight: 700; text-decoration: none; margin-right: auto; }
    header nav a { color: var(--muted); text-decoration: none; margin-left: 16px; }
    header nav a:hover, a { color: var(--gold); }
    main { padding-top: 24px; padding-bottom: 48px; }
    h1 { font-size: 30px; line-height: 1.25; margin: 8px 0 16px; }
    h2 { font-size: 21px; margin-top: 32px; }
    table { border-collapse: collapse; width: 100%; font-size: 15px; display: block; overflow-x: auto; }
    th, td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
    th { background: var(--card); }
    footer { color: var(--muted); font-size: 14px; padding-bottom: 32px; border-top: 1px solid var(--line); padding-top: 16px; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="{{ '/' | relative_url }}">Santa Claus Video Call &amp; Text</a>
    <nav>{% for link in site.data.nav %}<a href="{{ link.url | relative_url }}">{{ link.title }}</a>{% endfor %}</nav>
  </header>
  <main>{{ content }}</main>
  <footer>Santa Claus Video Call &amp; Text for iPhone and iPad.</footer>
</body>
</html>
